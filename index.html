<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading File...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #38bdf8;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .file-info {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
            word-break: break-all;
        }

        .file-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 9999px;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-msg {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            min-height: 22px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 20px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .btn-download:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .sub-text {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </div>

        <h1>Aapki file download ho rahi hai...</h1>
        <p class="file-info">
            File: <span class="file-badge" id="fileNameBadge">cn.zip</span>
        </p>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="status-msg" id="statusMessage">Tayari ki ja rahi hai...</p>

        <!-- Fallback manual button -->
        <a id="downloadBtn" href="cn.zip" download="cn.zip" class="btn-download">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Dobara Download Karein
        </a>

        <p class="sub-text">Agar download khud shuru na ho, to upar diye gaye button par click karein.</p>
    </div>

    <script>
        // File configuration
        const FILE_PATH = 'cn.zip';
        const FILE_NAME = 'cn.zip';

        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameBadge = document.getElementById('fileNameBadge');

        // Update elements
        downloadBtn.href = FILE_PATH;
        downloadBtn.setAttribute('download', FILE_NAME);
        fileNameBadge.textContent = FILE_NAME;

        function triggerDownload() {
            // Anchor element create kar ke programmatically click karna
            const link = document.createElement('a');
            link.href = FILE_PATH;
            link.setAttribute('download', FILE_NAME);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Auto download trigger when page loads
        window.addEventListener('DOMContentLoaded', () => {
            // Animation start
            setTimeout(() => {
                progressBar.style.width = '100%';
                statusMessage.textContent = 'Download shuru ho raha hai...';
            }, 300);

            // Auto-trigger download after 1 second (clean user feedback)
            setTimeout(() => {
                triggerDownload();
                statusMessage.textContent = 'Download shuru ho chuka hai!';
            }, 1000);
        });
    </script>
</body>
</html>
